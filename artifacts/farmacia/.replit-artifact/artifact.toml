kind = "web"
previewPath = "/"
title = "FarmaSystem - Gestão de Farmácia"
version = "1.0.0"
id = "artifacts/farmacia"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20247

[services.development]
run = "pnpm --filter @workspace/farmacia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/farmacia", "run", "build" ]
publicDir = "artifacts/farmacia/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20247"
BASE_PATH = "/"
